spring.application.name=auth-server

spring.datasource.url=jdbc:postgresql://pg-auth:5432/authdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

app.security.jwt.private-
app.security.jwt.public-
app.security.access-token-expiration-minutes=15
app.security.refresh-token-expiration-days=7
app.security.issuer=auth-service

app.cookies.access-token.name=acces_token
app.cookies.access-token.http-only=true
app.cookies.access-token.secure=false
app.cookies.access-token.max-age=900
app.cookies.access-token.path=/
app.cookies.access-token.same-site=strict

app.cookies.refresh-token.name=refresh-token
app.cookies.refresh-token.http-only=true
app.cookies.refresh-token.secure=false
app.cookies.refresh-token.max-age=604800
app.cookies.refresh-token.path=/api/auth/refresh
app.cookies.refresh-token.same-site=strict

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG